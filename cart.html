<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Pikari Bazar</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;padding-bottom:130px}
  
  header{position:sticky;top:0;z-index:100;background:#ff6b00;color:#fff;
         padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{font-size:18px;flex:1}
  header a{color:#fff;text-decoration:none;font-size:22px}
  
  .container{padding:12px}
  .item{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;
        display:flex;gap:12px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .item img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#eee;flex-shrink:0}
  .item-info{flex:1;min-width:0}
  .item-info h3{font-size:14px;font-weight:600;margin-bottom:4px;
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-info .price{color:#ff6b00;font-weight:700;font-size:14px}
  
  .qty-controls{display:flex;align-items:center;gap:8px;margin-top:6px}
  .qty-btn{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:6px;
           font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .qty-btn:active{background:#f0f0f0}
  .qty-num{font-weight:600;min-width:20px;text-align:center;font-size:14px}
  
  .remove-btn{background:none;border:none;color:#e74c3c;font-size:20px;cursor:pointer;padding:4px}
  
  .summary{position:fixed;bottom:70px;left:0;right:0;background:#fff;padding:12px 16px;
           border-top:1px solid #eee;box-shadow:0 -2px 8px rgba(0,0,0,.05);z-index:50}
  .summary-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}
  .summary-row.total{font-size:17px;font-weight:700;color:#ff6b00;margin-bottom:10px}
  
  /* Delivery Charge Input */
  .delivery-input-wrapper { display: flex; align-items: center; gap: 6px; }
  .delivery-input-wrapper input {
    width: 70px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 13px; text-align: right; outline: none; font-weight: 600; color: #ff6b00;
  }
  
  .checkout-btn{
    width:100%;padding:14px;background:#ff6b00;color:#fff;border:none;border-radius:10px;
    font-size:15px;font-weight:700;cursor:pointer; transition: transform 0.2s ease, background 0.2s;
  }
  .checkout-btn:active{background:#e55f00}
  .checkout-btn:disabled{background:#ccc;cursor:not-allowed}
  
  /* === BOUNCE ANIMATION for Confirm Button === */
  @keyframes bounceUpDown {
    0%   { transform: translateY(0); }
    25%  { transform: translateY(-15px); }
    50%  { transform: translateY(0); }
    75%  { transform: translateY(-8px); }
    100% { transform: translateY(0); }
  }
  .btn-bouncing { animation: bounceUpDown 0.6s ease-in-out; }

  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;
             display:flex;justify-content:space-around;padding:8px 0;z-index:100}
  nav.bottom a{flex:1;text-align:center;text-decoration:none;color:#888;font-size:11px;padding:4px}
  nav.bottom a.active{color:#ff6b00}
  nav.bottom a span{display:block;font-size:20px;margin-bottom:2px}
  
  .empty{text-align:center;padding:80px 20px;color:#888}
  .empty span{font-size:64px;display:block;margin-bottom:16px}
  .empty a{display:inline-block;margin-top:16px;padding:10px 24px;background:#ff6b00;color:#fff;
           text-decoration:none;border-radius:8px;font-weight:600}
  
  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;
         align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .modal-content{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;
                 max-height:90vh;overflow-y:auto;animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal h2{font-size:18px;margin-bottom:16px;text-align:center}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#444}
  .form-group input,.form-group textarea,.form-group select{
    width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;
    font-family:inherit;background:#f9f9f9}
  .form-group textarea{resize:vertical;min-height:70px}
  .modal-btn{width:100%;padding:14px;background:#ff6b00;color:#fff;border:none;border-radius:10px;
             font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
  .modal-btn.cancel{background:#eee;color:#666;margin-top:8px}

  /* === PREMIUM POPUP DESIGN === */
  .popup-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
    z-index: 99999; display: none; align-items: center; justify-content: center;
  }
  .popup-overlay.show { display: flex; }
  .popup-box {
    background: #fff; border-radius: 24px; padding: 30px 25px;
    width: 85%; max-width: 320px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    transform: scale(0.7); opacity: 0;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .popup-overlay.show .popup-box {
    transform: scale(1); opacity: 1;
  }
  .popup-icon {
    width: 80px; height: 80px; border-radius: 50%;
    margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #fff;
    transform: scale(0);
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.15s;
  }
  .popup-overlay.show .popup-icon { transform: scale(1); }
  .popup-icon.success { background: linear-gradient(135deg, #00b09b, #96c93d); box-shadow: 0 10px 20px rgba(0,176,155,0.4); }
  .popup-icon.error { background: linear-gradient(135deg, #e74c3c, #c0392b); box-shadow: 0 10px 20px rgba(231,76,60,0.4); }
  .popup-message {
    font-size: 17px; font-weight: 700; color: #333;
    opacity: 0; transform: translateY(10px);
    transition: all 0.4s ease 0.35s;
  }
  .popup-overlay.show .popup-message { opacity: 1; transform: translateY(0); }
  .popup-subtext {
    font-size: 13px; color: #888; margin-top: 8px;
    opacity: 0; transition: all 0.4s ease 0.45s;
  }
  .popup-overlay.show .popup-subtext { opacity: 1; }
</style>
</head>
<body>

<!-- Premium Popup -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box">
    <div class="popup-icon" id="popupIcon">✓</div>
    <div class="popup-message" id="popupMsg">Success!</div>
    <div class="popup-subtext" id="popupSubtext"></div>
  </div>
</div>

<header>
  <a href="index.html">←</a>
  <h1>🛒 My Cart</h1>
</header>

<div class="container" id="cartList"></div>

<div class="summary" id="summary" style="display:none">
  <div class="summary-row">
    <span>Subtotal</span>
    <span id="subtotal">৳0</span>
  </div>
  <div class="summary-row">
    <span>Delivery Charge</span>
    <div class="delivery-input-wrapper">
      <span>৳</span>
      <input type="number" id="deliveryInput" value="60" min="0">
    </div>
  </div>
  <div class="summary-row total">
    <span>Total</span>
    <span id="grandTotal">৳0</span>
  </div>
  <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
</div>

<nav class="bottom">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="cart.html" class="active"><span>🛒</span>Cart</a>
  <a href="contact.html"><span>📞</span>Contact</a>
  <a href="admin.html"><span>⚙️</span>Admin</a>
</nav>

<!-- Checkout Modal -->
<div class="modal" id="checkoutModal">
  <div class="modal-content">
    <h2>📋 Order Info</h2>
    <div class="form-group">
      <label>নাম *</label>
      <input id="cName" placeholder="আপনার নাম" required>
    </div>
    <div class="form-group">
      <label>মোবাইল *</label>
      <input id="cPhone" type="tel" placeholder="01XXXXXXXXX" required>
    </div>
    <div class="form-group">
      <label>ঠিকানা *</label>
      <textarea id="cAddress" placeholder="বিস্তারিত ঠিকানা" required></textarea>
    </div>
    <div class="form-group">
      <label>পেমেন্ট</label>
      <select id="cPayment">
        <option value="cod">Cash on Delivery</option>
        <option value="bkash">bKash (manual)</option>
      </select>
    </div>
    <button class="modal-btn" id="confirmOrder">Confirm Order</button>
    <button class="modal-btn cancel" id="cancelModal">Cancel</button>
  </div>
</div>

<script type="module">
import { db, getUserId } from './config.js';
import { ref, onValue, remove, push, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const uid = getUserId();
let cartData = {};
let deliveryCharge = 60;

// === PREMIUM POPUP FUNCTION ===
function showPopup(type, message, subtext = '') {
  const overlay = document.getElementById('popupOverlay');
  const icon = document.getElementById('popupIcon');
  const msg = document.getElementById('popupMsg');
  const sub = document.getElementById('popupSubtext');
  
  overlay.classList.remove('show');
  icon.className = 'popup-icon';
  icon.textContent = '';
  void overlay.offsetWidth;
  
  if (type === 'success') {
    icon.classList.add('success');
    icon.textContent = '✓';
    msg.textContent = message || 'Success!';
  } else {
    icon.classList.add('error');
    icon.textContent = '✕';
    msg.textContent = message || 'Error!';
  }
  sub.textContent = subtext;
  
  overlay.classList.add('show');
  
  setTimeout(() => {
    overlay.classList.remove('show');
  }, 2500);
}

function driveUrl(url) {
  if (!url) return 'https://via.placeholder.com/100?text=No';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w200`;
  return url;
}

onValue(ref(db, `carts/${uid}`), (snap) => {
  cartData = snap.val() || {};
  render();
});

document.getElementById('deliveryInput').addEventListener('input', (e) => {
  deliveryCharge = +e.target.value || 0;
  updateTotals();
});

function render() {
  const list = document.getElementById('cartList');
  const summary = document.getElementById('summary');
  const entries = Object.entries(cartData);
  
  if (entries.length === 0) {
    list.innerHTML = `<div class="empty">
      <span>🛒</span>
      <p>Cart is empty</p>
      <a href="index.html">Shop Now</a>
    </div>`;
    summary.style.display = 'none';
    return;
  }
  
  summary.style.display = 'block';
  list.innerHTML = '';
  let subtotal = 0;
  
  entries.forEach(([id, i]) => {
    subtotal += i.price * i.qty;
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <img src="${driveUrl(i.image)}" alt="">
      <div class="item-info">
        <h3>${i.name}</h3>
        <p class="price">৳${i.price}</p>
        <div class="qty-controls">
          <button class="qty-btn" data-action="dec">−</button>
          <span class="qty-num">${i.qty}</span>
          <button class="qty-btn" data-action="inc">+</button>
        </div>
      </div>
      <button class="remove-btn">🗑</button>`;
    
    div.querySelector('[data-action="inc"]').onclick = () => 
      update(ref(db, `carts/${uid}/${id}`), { qty: i.qty + 1 });
    div.querySelector('[data-action="dec"]').onclick = () => {
      if (i.qty <= 1) remove(ref(db, `carts/${uid}/${id}`));
      else update(ref(db, `carts/${uid}/${id}`), { qty: i.qty - 1 });
    };
    div.querySelector('.remove-btn').onclick = () => 
      remove(ref(db, `carts/${uid}/${id}`));
    
    list.appendChild(div);
  });
  
  updateTotals(subtotal);
}

function updateTotals(subtotal = null) {
  if (subtotal === null) {
    subtotal = Object.values(cartData).reduce((s, i) => s + i.price * i.qty, 0);
  }
  document.getElementById('subtotal').textContent = '৳' + subtotal;
  document.getElementById('grandTotal').textContent = '৳' + (subtotal + deliveryCharge);
}

document.getElementById('checkoutBtn').onclick = () => {
  document.getElementById('checkoutModal').classList.add('show');
};
document.getElementById('cancelModal').onclick = () => {
  document.getElementById('checkoutModal').classList.remove('show');
};

// Confirm Order with Bounce Animation and Premium Popup
document.getElementById('confirmOrder').onclick = async () => {
  const name = document.getElementById('cName').value.trim();
  const phone = document.getElementById('cPhone').value.trim();
  const address = document.getElementById('cAddress').value.trim();
  const payment = document.getElementById('cPayment').value;
  const btn = document.getElementById('confirmOrder');
  
  if (!name || !phone || !address) {
    showPopup('error', 'সব তথ্য পূরণ করুন', 'Name, Phone, Address required');
    return;
  }
  
  // Bounce animation
  btn.classList.add('btn-bouncing');
  
  setTimeout(async () => {
    btn.classList.remove('btn-bouncing');
    btn.textContent = 'Processing...';
    btn.disabled = true;
    
    const subtotal = Object.values(cartData).reduce((s, i) => s + i.price * i.qty, 0);
    const orderRef = push(ref(db, 'orders'));
    try {
      await set(orderRef, {
        userId: uid,
        customer: { name, phone, address },
        items: cartData,
        subtotal,
        delivery: deliveryCharge,
        total: subtotal + deliveryCharge,
        payment,
        status: 'pending',
        createdAt: Date.now()
      });
      
      await remove(ref(db, `carts/${uid}`));
      document.getElementById('checkoutModal').classList.remove('show');
      
      // Show success popup
      showPopup('success', 'অর্ডার কনফার্ম হয়েছে!', 'আমরা শীঘ্রই যোগাযোগ করবো');
      
      // Redirect after popup finishes
      setTimeout(() => {
        location.href = 'index.html';
      }, 2500);
      
    } catch (e) {
      showPopup('error', 'অর্ডার ব্যর্থ হয়েছে', e.message);
      btn.textContent = 'Confirm Order';
      btn.disabled = false;
    }
  }, 600);
};
</script>
</body>
</html>
