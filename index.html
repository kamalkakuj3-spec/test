<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikari Bazar</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;padding-bottom:70px}
  
  header{position:sticky;top:0;z-index:100;background:#ff6b00;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{font-size:18px;font-weight:700}
  .cart-icon{position:relative;font-size:22px;text-decoration:none;color:#fff}
  .cart-count{position:absolute;top:-6px;right:-8px;background:#fff;color:#ff6b00;font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
  
  /* Image Slider Styles */
  .slider-container {
    width: 100%;
    height: 180px;
    background: #fff;
    margin-bottom: 8px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .slider-track {
    display: flex;
    height: 100%;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .slider-slide {
    min-width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f0f0f0;
  }
  .slider-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .slider-dots {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
  }
  .slider-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    cursor: pointer;
    transition: 0.3s;
  }
  .slider-dot.active {
    background: #fff;
    width: 20px;
    border-radius: 4px;
  }

  /* Products Grid */
  .products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 12px 12px}
  .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;flex-direction:column}
  .card img{width:100%;height:150px;object-fit:cover;background:#eee;pointer-events:none;user-select:none;-webkit-user-drag:none}
  .card-body{padding:10px;display:flex;flex-direction:column;flex:1}
  .card-body h3{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
  .price{color:#ff6b00;font-weight:700;font-size:15px;margin-bottom:8px}
  .btn{width:100%;padding:8px;background:#ff6b00;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;margin-top:auto}
  .btn:active{background:#e55f00}
  
  /* Premium Skeleton Loading */
  .skeleton-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    display: flex;
    flex-direction: column;
    height: 250px;
  }
  .skeleton-img {
    width: 100%;
    height: 150px;
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  .skeleton-text {
    height: 12px;
    margin: 10px 10px 0 10px;
    border-radius: 4px;
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  .skeleton-text.short { width: 40%; margin-bottom: 10px; }
  .skeleton-btn {
    height: 32px;
    margin: auto 10px 10px 10px;
    border-radius: 8px;
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  
  .empty{text-align:center;padding:60px 20px;color:#888}
  .empty span{font-size:48px;display:block;margin-bottom:12px}
  
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:200}
  .toast.show{opacity:1}
  
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0;z-index:100}
  nav.bottom a{flex:1;text-align:center;text-decoration:none;color:#888;font-size:11px;padding:4px}
  nav.bottom a.active{color:#ff6b00}
  nav.bottom a span{display:block;font-size:20px;margin-bottom:2px}
</style>
</head>
<body>

<header>
  <h1>🛍️ Pikari Bazar</h1>
  <a href="cart.html" class="cart-icon">🛒<span class="cart-count" id="cartCount">0</span></a>
</header>

<!-- Image Slider -->
<div class="slider-container" id="sliderContainer" style="display:none;">
  <div class="slider-track" id="sliderTrack"></div>
  <div class="slider-dots" id="sliderDots"></div>
</div>

<div class="products" id="productList">
  <!-- Skeleton Loaders -->
  <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div><div class="skeleton-btn"></div></div>
  <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div><div class="skeleton-btn"></div></div>
  <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div><div class="skeleton-btn"></div></div>
  <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div><div class="skeleton-btn"></div></div>
</div>

<div class="toast" id="toast">Added to cart!</div>

<nav class="bottom">
  <a href="index.html" class="active"><span>🏠</span>Home</a>
  <a href="cart.html"><span>🛒</span>Cart</a>
  <a href="admin.html"><span>⚙️</span>Admin</a>
</nav>

<script type="module">
import { db, getUserId } from './config.js';
import { ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const uid = getUserId();
const list = document.getElementById('productList');
const toast = document.getElementById('toast');

// Google Drive link → direct optimized image URL (Fast loading, prevents download)
function driveUrl(url, size = 400) {
  if (!url) return 'https://via.placeholder.com/300x300?text=No+Image';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  if (m) {
    return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${size}`;
  }
  return url;
}

// --- Slider Logic ---
let slideIndex = 0;
let slideInterval;

function initSlider() {
  const sliderContainer = document.getElementById('sliderContainer');
  const track = document.getElementById('sliderTrack');
  const dotsContainer = document.getElementById('sliderDots');
  
  // এখানে আপনার স্লাইডারের ছবির গুগল ড্রাইভ লিংকগুলো বসাবেন
  const sliderImages = [
    "https://drive.google.com/file/d/1QU8GsUnu0/view?usp=sharing", // উদাহরণস্বরূপ ড্রাইভ লিংক ১
    "https://drive.google.com/file/d/1A2B3C4D5E6F7G/view?usp=sharing", // উদাহরণস্বরূপ ড্রাইভ লিংক ২
    "https://drive.google.com/file/d/1H8I9J0K1L2M3N/view?usp=sharing"  // উদাহরণস্বরূপ ড্রাইভ লিংক ৩
  ];

  if (sliderImages.length === 0) return;
  
  sliderContainer.style.display = 'block';
  track.innerHTML = '';
  dotsContainer.innerHTML = '';

  sliderImages.forEach((imgUrl, i) => {
    // Slide তৈরি
    const slide = document.createElement('div');
    slide.className = 'slider-slide';
    slide.innerHTML = `<img src="${driveUrl(imgUrl, 800)}" loading="lazy" onerror="this.src='https://via.placeholder.com/800x300?text=Error'">`;
    track.appendChild(slide);

    // Dot তৈরি
    const dot = document.createElement('div');
    dot.className = `slider-dot ${i === 0 ? 'active' : ''}`;
    dot.onclick = () => goToSlide(i);
    dotsContainer.appendChild(dot);
  });

  // অটো স্লাইড (৩ সেকেন্ড পর পর)
  startAutoSlide();
}

function goToSlide(index) {
  const track = document.getElementById('sliderTrack');
  const dots = document.querySelectorAll('.slider-dot');
  const totalSlides = dots.length;
  
  if (index >= totalSlides) slideIndex = 0;
  else if (index < 0) slideIndex = totalSlides - 1;
  else slideIndex = index;
  
  track.style.transform = `translateX(-${slideIndex * 100}%)`;
  
  dots.forEach((dot, i) => {
    dot.classList.toggle('active', i === slideIndex);
  });
}

function startAutoSlide() {
  clearInterval(slideInterval);
  slideInterval = setInterval(() => {
    goToSlide(slideIndex + 1);
  }, 3000);
}

// ম্যানুয়াল সোয়াইপ সাপোর্ট (মোবাইলের জন্য)
let startX = 0;
let isDragging = false;

function setupSwipe() {
  const container = document.getElementById('sliderContainer');
  
  container.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    isDragging = true;
    clearInterval(slideInterval);
  }, {passive: true});

  container.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const diff = startX - e.touches[0].clientX;
    if (Math.abs(diff) > 50) { // ৫০ পিক্সেল সোয়াইপ হলে
      if (diff > 0) goToSlide(slideIndex + 1); // বামে সোয়াইপ
      else goToSlide(slideIndex - 1); // ডানে সোয়াইপ
      isDragging = false;
      startAutoSlide();
    }
  }, {passive: true});

  container.addEventListener('touchend', () => {
    isDragging = false;
    startAutoSlide();
  });
}

// Initialize slider
initSlider();
setupSwipe();


// --- Products Logic ---
onValue(ref(db, 'products'), (snap) => {
  const data = snap.val() || {};
  const items = Object.entries(data).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  list.innerHTML = '';
  
  if (items.length === 0) {
    list.innerHTML = `<div class="empty" style="grid-column:1/-1"><span>📦</span>No products yet</div>`;
    return;
  }
  
  items.forEach(([id, p]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${driveUrl(p.image, 400)}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300?text=Error'">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="price">৳${p.price}</p>
        <button class="btn" data-id="${id}">Add to Cart</button>
      </div>`;
    card.querySelector('.btn').onclick = () => addToCart(id, p);
    list.appendChild(card);
  });
});

async function addToCart(pid, product) {
  const cartRef = ref(db, `carts/${uid}/${pid}`);
  const snap = await get(cartRef);
  const existing = snap.val();
  await set(cartRef, {
    productId: pid,
    name: product.name,
    price: product.price,
    image: product.image,
    qty: existing ? existing.qty + 1 : 1
  });
  showToast('✅ Added to cart');
}

// Cart count
onValue(ref(db, `carts/${uid}`), (snap) => {
  const c = snap.val() || {};
  const count = Object.values(c).reduce((s, i) => s + i.qty, 0);
  document.getElementById('cartCount').textContent = count;
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}
</script>
</body>
</html>
