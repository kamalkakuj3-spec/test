<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikari Bazar</title>
<link href="https://unpkg.com/cloudinary-video-player@1.9.9/dist/cld-video-player.min.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;padding-bottom:70px}
  
  /* Header */
  header{position:sticky;top:0;z-index:100;background:#ff6b00;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{font-size:18px;font-weight:700}
  .cart-icon{position:relative;font-size:22px;text-decoration:none;color:#fff}
  .cart-count{position:absolute;top:-6px;right:-8px;background:#fff;color:#ff6b00;font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}

  /* User Popup Menu */
  .user-menu {
    position: absolute; top: 60px; right: 16px; background: #fff; border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2); padding: 10px; min-width: 180px;
    display: none; z-index: 200; animation: fadeInDown 0.3s ease;
  }
  .user-menu.show { display: block; }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .user-menu .name { font-size: 14px; font-weight: 700; color: #333; padding: 8px; border-bottom: 1px solid #eee; margin-bottom: 5px; }
  .user-menu a { display: block; padding: 10px 8px; text-decoration: none; color: #444; font-size: 14px; border-radius: 6px; }
  .user-menu a:active { background: #f5f5f5; }
  .user-menu .logout { color: #e74c3c; font-weight: 600; }

  /* Search Bar */
  .search-bar { display: none; padding: 10px 12px; background: #fff; border-bottom: 1px solid #eee; }
  .search-bar.show { display: flex; gap: 8px; }
  .search-bar input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none; }
  .search-bar button { padding: 10px 16px; background: #ff6b00; color: #fff; border: none; border-radius: 20px; font-weight: 600; cursor: pointer; }
  
  /* Media Containers */
  .media-container { width: 100%; height: 200px; background: #000; display: none; position: relative; overflow: hidden; }
  .video-container video { width: 100%; height: 100%; object-fit: cover; }

  /* Image Slider */
  .slider-track { display: flex; height: 100%; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
  .slider-slide { min-width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #f0f0f0; }
  .slider-slide img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .slider-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .slider-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.5); cursor: pointer; transition: 0.3s; }
  .slider-dot.active { background: #fff; width: 20px; border-radius: 4px; }

  /* Marquee Notice */
  .notice-bar { display: none; background: #222; color: #ff6b00; padding: 8px 0; overflow: hidden; white-space: nowrap; font-size: 14px; font-weight: 600; position: relative; box-shadow: inset 0 -2px 5px rgba(0,0,0,0.2); }
  .notice-text { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

  /* Category Filter Bar */
  .category-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fff; border-bottom: 1px solid #eee; }
  .cat-scroll { flex: 1; display: flex; overflow-x: auto; white-space: nowrap; gap: 8px; scrollbar-width: none; }
  .cat-scroll::-webkit-scrollbar { display: none; }
  .cat-btn { padding: 6px 14px; border: 1px solid #ddd; border-radius: 20px; background: #f9f9f9; font-size: 13px; font-weight: 600; color: #555; cursor: pointer; transition: 0.2s; }
  .cat-btn.active { background: #ff6b00; color: #fff; border-color: #ff6b00; }
  .filter-icon { background: #ff6b00; color: #fff; border: none; padding: 7px 12px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

  /* Products Grid */
  .products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
  .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;flex-direction:column}
  .card img{width:100%;height:150px;object-fit:cover;background:#eee;user-select:none;-webkit-user-drag:none;cursor:pointer}
  .card-body{padding:10px;display:flex;flex-direction:column;flex:1}
  .card-body h3{font-size:13px;font-weight:600;line-height:1.3;margin:0 0 2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .price{color:#ff6b00;font-weight:700;font-size:15px;margin:0 0 8px 0;}
  .btn{width:100%;padding:8px;background:#ff6b00;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;margin-top:auto}
  .btn:active{background:#e55f00}
  
  /* Center Toast Popup */
  .center-toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
    background: linear-gradient(135deg, #ff6b00, #ff8c33); color: #fff;
    padding: 16px 28px; border-radius: 15px; font-size: 15px; font-weight: 700;
    box-shadow: 0 10px 30px rgba(255, 107, 0, 0.4); z-index: 10000;
    opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-align: center; display: flex; align-items: center; gap: 10px;
  }
  .center-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Product Details Modal */
  .product-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9998; display: none; align-items: center; justify-content: center; padding: 20px; }
  .product-modal.show { display: flex; }
  .product-modal-content { background: #fff; border-radius: 16px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; animation: zoomIn 0.3s ease; }
  @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .product-modal-content img { width: 100%; height: 250px; object-fit: cover; }
  .modal-body { padding: 16px; }
  .modal-body h2 { font-size: 18px; color: #333; margin-bottom: 8px; }
  .modal-body .modal-price { font-size: 20px; color: #ff6b00; font-weight: 700; margin-bottom: 12px; }
  .modal-body .modal-desc { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; background: #f9f9f9; padding: 10px; border-radius: 8px;}
  .close-modal-btn { width: 100%; padding: 12px; background: #ff6b00; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }

  /* Filter Modal */
  .filter-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; align-items: flex-end; justify-content: center; }
  .filter-modal.show { display: flex; }
  .filter-content { background: #fff; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
  .filter-header h3 { font-size: 16px; color: #333; }
  .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; padding: 0 5px; }
  .filter-list { overflow-y: auto; flex: 1; margin-bottom: 15px; }
  .filter-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .filter-item span { font-size: 14px; font-weight: 500; color: #333; }
  .filter-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: #ff6b00; cursor: pointer; }
  .apply-btn { width: 100%; padding: 14px; background: #ff6b00; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .clear-btn { width: 100%; padding: 10px; background: #f0f0f0; color: #555; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }

  /* Center Spinner Loader */
  .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(245, 245, 247, 0.8); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 9999; }
  .spinner { width: 50px; height: 50px; border: 5px solid #ffe6d9; border-top: 5px solid #ff6b00; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .empty{text-align:center;padding:60px 20px;color:#888}
  .empty span{font-size:48px;display:block;margin-bottom:12px}
  
  /* Bottom Navigation */
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0;z-index:100}
  nav.bottom a{flex:1;text-align:center;text-decoration:none;color:#888;font-size:11px;padding:4px}
  nav.bottom a.active{color:#ff6b00}
  nav.bottom a span{display:block;font-size:20px;margin-bottom:2px}
</style>
</head>
<body>

<!-- Center Loading Spinner -->
<div class="loader-overlay" id="loaderOverlay">
  <div class="spinner"></div>
</div>

<!-- Header (শুধু লোগো এবং কার্ট) -->
<header>
  <h1>🛍️ Pikari Bazar</h1>
  <div class="header-right">
    <a href="cart.html" class="cart-icon">🛒<span class="cart-count" id="cartCount">0</span></a>
  </div>
</header>

<!-- User Menu Dropdown -->
<div class="user-menu" id="userMenu">
  <div class="name" id="userMenuName">User</div>
  <a href="my-orders.html">📦 My Orders</a>
  <a href="#" class="logout" id="logoutBtn">🚪 Logout</a>
</div>

<!-- Search Bar -->
<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="Search products...">
  <button id="searchBtn">Search</button>
</div>

<!-- Media Section (Video OR Slider) -->
<div id="videoContainer" class="media-container">
  <video id="cloudinaryVideo" autoplay muted loop playsinline controls style="width:100%; height:100%; object-fit:cover;"></video>
</div>

<div id="sliderContainer" class="media-container">
  <div class="slider-track" id="sliderTrack"></div>
  <div class="slider-dots" id="sliderDots"></div>
</div>

<!-- Marquee Notice -->
<div class="notice-bar" id="noticeBar">
  <div class="notice-text" id="noticeText"></div>
</div>

<!-- Category Filter Bar -->
<div class="category-bar">
  <div class="cat-scroll" id="categoryBar">
    <div class="cat-btn active" data-cat="all">All</div>
  </div>
  <button class="filter-icon" id="openFilterBtn">⚙️ Filter</button>
</div>

<div class="products" id="productList"></div>

<!-- Center Toast Popup -->
<div class="center-toast" id="centerToast">✅ Added to cart!</div>

<!-- Product Details Modal -->
<div class="product-modal" id="productModal">
  <div class="product-modal-content">
    <img id="modalImg" src="" alt="">
    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <p class="modal-price" id="modalPrice"></p>
      <p class="modal-desc" id="modalDesc"></p>
      <button class="close-modal-btn" id="closeProductModal">Close</button>
    </div>
  </div>
</div>

<!-- Filter Modal -->
<div class="filter-modal" id="filterModal">
  <div class="filter-content">
    <div class="filter-header">
      <h3>🗂️ Select Categories</h3>
      <button class="close-btn" id="closeFilterBtn">×</button>
    </div>
    <div class="filter-list" id="filterList"></div>
    <button class="clear-btn" id="clearFilterBtn">Clear All</button>
    <button class="apply-btn" id="applyFilterBtn">Apply Filter</button>
  </div>
</div>

<!-- Bottom Navigation (Contact বাদ, Search & Profile যোগ) -->
<nav class="bottom">
  <a href="index.html" class="active"><span>🏠</span>Home</a>
  <a href="#" id="navSearchBtn"><span>🔍</span>Search</a>
  <a href="login.html" id="navProfileBtn"><span>👤</span>Profile</a>
  <a href="cart.html"><span>🛒</span>Cart</a>
  <a href="admin.html"><span>⚙️</span>Admin</a>
</nav>

<script type="module">
import { db, auth, getUserId } from './config.js';
import { ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

let uid = getUserId();
const list = document.getElementById('productList');
const loader = document.getElementById('loaderOverlay');
const video = document.getElementById('cloudinaryVideo');
const centerToast = document.getElementById('centerToast');
const productModal = document.getElementById('productModal');

let allProducts = [];
let currentCategory = 'all';
let allCategories = [];
let selectedCategories = new Set();
let searchQuery = '';

// === AUTH STATE CHECK ===
onAuthStateChanged(auth, (user) => {
  const navProfileBtn = document.getElementById('navProfileBtn');
  const userMenu = document.getElementById('userMenu');
  
  if (user) {
    uid = user.uid;
    navProfileBtn.href = '#';
    navProfileBtn.onclick = (e) => {
      e.preventDefault();
      document.getElementById('userMenuName').textContent = user.displayName || user.email;
      userMenu.classList.toggle('show');
    };
    
    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await signOut(auth);
      localStorage.removeItem('pb_uid');
      window.location.reload();
    };
  } else {
    uid = getUserId();
    navProfileBtn.href = 'login.html';
    navProfileBtn.onclick = null;
    userMenu.classList.remove('show');
  }
});

// বাইরে ক্লিক করলে মেনু বন্ধ
document.addEventListener('click', (e) => {
  const userMenu = document.getElementById('userMenu');
  const navProfileBtn = document.getElementById('navProfileBtn');
  if (!userMenu.contains(e.target) && !navProfileBtn.contains(e.target)) {
    userMenu.classList.remove('show');
  }
});

function driveUrl(url, size = 400) {
  if (!url) return 'https://via.placeholder.com/300x300?text=No+Image';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${size}`;
  return url;
}

// Search Toggle via Bottom Nav
document.getElementById('navSearchBtn').onclick = (e) => {
  e.preventDefault();
  const bar = document.getElementById('searchBar');
  bar.classList.toggle('show');
  if (bar.classList.contains('show')) document.getElementById('searchInput').focus();
};

document.getElementById('searchBtn').onclick = () => {
  searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  renderProducts();
};

document.getElementById('searchInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('searchBtn').click();
});

// --- Media Logic ---
onValue(ref(db, 'mediaSettings'), (snap) => {
  const settings = snap.val() || {};
  const videoContainer = document.getElementById('videoContainer');
  const sliderContainer = document.getElementById('sliderContainer');
  if (settings.mode === 'video' && settings.videoUrl) {
    videoContainer.style.display = 'block';
    sliderContainer.style.display = 'none';
    if (video.src !== settings.videoUrl) {
      video.src = settings.videoUrl;
      video.muted = true; 
      video.play().catch(e => console.log("Autoplay blocked:", e));
    }
  } else {
    videoContainer.style.display = 'none';
    sliderContainer.style.display = 'block';
    video.pause();
    video.src = ''; 
  }
});

// --- Auto Pause Video ---
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      if (video.src && video.paused) video.play().catch(e => {});
    } else {
      if (!video.paused) video.pause();
    }
  });
}, { threshold: 0.1 });
const videoContainer = document.getElementById('videoContainer');
if (videoContainer) observer.observe(videoContainer);

// --- Slider Logic ---
let slideIndex = 0;
let slideInterval;
let totalSlides = 0;

function goToSlide(index) {
  if (totalSlides === 0) return;
  const track = document.getElementById('sliderTrack');
  const dots = document.querySelectorAll('.slider-dot');
  if (index >= totalSlides) slideIndex = 0;
  else if (index < 0) slideIndex = totalSlides - 1;
  else slideIndex = index;
  track.style.transform = `translateX(-${slideIndex * 100}%)`;
  dots.forEach((dot, i) => dot.classList.toggle('active', i === slideIndex));
}

function startAutoSlide() {
  clearInterval(slideInterval);
  if (totalSlides <= 1) return;
  slideInterval = setInterval(() => goToSlide(slideIndex + 1), 3000);
}

onValue(ref(db, 'slider'), (snap) => {
  const entries = Object.entries(snap.val() || {}).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  const track = document.getElementById('sliderTrack');
  const dotsContainer = document.getElementById('sliderDots');
  if (entries.length === 0) { totalSlides = 0; return; }
  track.innerHTML = ''; dotsContainer.innerHTML = '';
  totalSlides = entries.length; slideIndex = 0;
  entries.forEach(([id, s], i) => {
    const slide = document.createElement('div');
    slide.className = 'slider-slide';
    slide.innerHTML = `<img src="${driveUrl(s.image, 800)}" loading="lazy" onerror="this.src='https://via.placeholder.com/800x300?text=Error'">`;
    track.appendChild(slide);
    const dot = document.createElement('div');
    dot.className = `slider-dot ${i === 0 ? 'active' : ''}`;
    dot.onclick = () => goToSlide(i);
    dotsContainer.appendChild(dot);
  });
  startAutoSlide();
});

// --- Notice Marquee ---
onValue(ref(db, 'notice'), (snap) => {
  const data = snap.val();
  const bar = document.getElementById('noticeBar');
  const textEl = document.getElementById('noticeText');
  if (data && data.text) {
    textEl.textContent = data.text;
    bar.style.display = 'block';
  } else {
    bar.style.display = 'none';
  }
});

// --- Category Logic ---
onValue(ref(db, 'categories'), (snap) => {
  const data = snap.val() || {};
  allCategories = Object.values(data).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const bar = document.getElementById('categoryBar');
  bar.innerHTML = '<div class="cat-btn active" data-cat="all">All</div>';
  allCategories.forEach(c => {
    bar.innerHTML += `<div class="cat-btn" data-cat="${c.name}">${c.name}</div>`;
  });
  bar.querySelectorAll('.cat-btn').forEach(btn => {
    btn.onclick = () => {
      bar.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.cat;
      selectedCategories.clear();
      if (currentCategory !== 'all') selectedCategories.add(currentCategory);
      renderProducts();
    };
  });

  const filterList = document.getElementById('filterList');
  filterList.innerHTML = '';
  allCategories.forEach(c => {
    const label = document.createElement('label');
    label.className = 'filter-item';
    label.innerHTML = `<span>${c.name}</span><input type="checkbox" value="${c.name}" ${selectedCategories.has(c.name) ? 'checked' : ''}>`;
    filterList.appendChild(label);
  });
});

// --- Filter Modal ---
const filterModal = document.getElementById('filterModal');
document.getElementById('openFilterBtn').onclick = () => filterModal.classList.add('show');
document.getElementById('closeFilterBtn').onclick = () => filterModal.classList.remove('show');
filterModal.onclick = (e) => { if (e.target === filterModal) filterModal.classList.remove('show'); };

document.getElementById('applyFilterBtn').onclick = () => {
  selectedCategories.clear();
  const checkboxes = document.querySelectorAll('#filterList input[type="checkbox"]:checked');
  checkboxes.forEach(cb => selectedCategories.add(cb.value));
  const bar = document.getElementById('categoryBar');
  bar.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  if (selectedCategories.size === 0) {
    currentCategory = 'all';
    bar.querySelector('[data-cat="all"]').classList.add('active');
  } else if (selectedCategories.size === 1) {
    currentCategory = [...selectedCategories][0];
    const btn = bar.querySelector(`[data-cat="${currentCategory}"]`);
    if (btn) btn.classList.add('active');
  } else {
    currentCategory = 'multi';
  }
  filterModal.classList.remove('show');
  renderProducts();
};

document.getElementById('clearFilterBtn').onclick = () => {
  document.querySelectorAll('#filterList input[type="checkbox"]').forEach(cb => cb.checked = false);
  selectedCategories.clear();
  currentCategory = 'all';
  const bar = document.getElementById('categoryBar');
  bar.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  bar.querySelector('[data-cat="all"]').classList.add('active');
  filterModal.classList.remove('show');
  renderProducts();
};

// --- Products Logic ---
onValue(ref(db, 'products'), (snap) => {
  const data = snap.val() || {};
  allProducts = Object.entries(data).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  renderProducts();
  if (loader) loader.style.display = 'none';
});

function renderProducts() {
  list.innerHTML = '';
  let filtered;
  if (currentCategory === 'all') filtered = allProducts;
  else if (currentCategory === 'multi') filtered = allProducts.filter(([id, p]) => selectedCategories.has(p.category));
  else filtered = allProducts.filter(([id, p]) => p.category === currentCategory);

  if (searchQuery) {
    filtered = filtered.filter(([id, p]) => p.name.toLowerCase().includes(searchQuery));
  }
    
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty" style="grid-column:1/-1"><span>📦</span>No products found</div>`;
    return;
  }
  
  filtered.forEach(([id, p]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${driveUrl(p.image, 400)}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300?text=Error'">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="price">৳${p.price}</p>
        <button class="btn" data-id="${id}">Add to Cart</button>
      </div>`;
    card.querySelector('img').onclick = () => openProductModal(p);
    card.querySelector('.btn').onclick = (e) => {
      e.stopPropagation();
      addToCart(id, p);
    };
    list.appendChild(card);
  });
}

// --- Product Modal Logic ---
function openProductModal(p) {
  if (!p.desc || p.desc.trim() === '') {
    showCenterToast('ℹ️ এই প্রোডাক্টের কোনো বিবরণ নেই');
    return;
  }
  document.getElementById('modalImg').src = driveUrl(p.image, 600);
  document.getElementById('modalTitle').textContent = p.name;
  document.getElementById('modalPrice').textContent = '৳' + p.price;
  document.getElementById('modalDesc').textContent = p.desc;
  productModal.classList.add('show');
}

document.getElementById('closeProductModal').onclick = () => productModal.classList.remove('show');
productModal.onclick = (e) => { if (e.target === productModal) productModal.classList.remove('show'); };

async function addToCart(pid, product) {
  const cartRef = ref(db, `carts/${uid}/${pid}`);
  const snap = await get(cartRef);
  const existing = snap.val();
  await set(cartRef, {
    productId: pid, name: product.name, price: product.price,
    image: product.image, qty: existing ? existing.qty + 1 : 1
  });
  showCenterToast('✅ Added to cart!');
}

function showCenterToast(msg) {
  centerToast.textContent = msg;
  centerToast.classList.add('show');
  setTimeout(() => centerToast.classList.remove('show'), 2000);
}

// Cart count (UID পরিবর্তন হলে আবার লোড হবে)
let cartUnsubscribe = null;
function loadCartCount(currentUid) {
  if (cartUnsubscribe) cartUnsubscribe();
  cartUnsubscribe = onValue(ref(db, `carts/${currentUid}`), (snap) => {
    const c = snap.val() || {};
    const count = Object.values(c).reduce((s, i) => s + i.qty, 0);
    document.getElementById('cartCount').textContent = count;
  });
}

// Auth state পরিবর্তনের সাথে কার্ট লোড
onAuthStateChanged(auth, (user) => {
  const currentUid = user ? user.uid : getUserId();
  loadCartCount(currentUid);
});
</script>
