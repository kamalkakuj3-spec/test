<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikari Bazar</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;padding-bottom:70px}
  
  /* Header */
  header{position:sticky;top:0;z-index:100;background:#ff6b00;color:#fff;
         padding:14px 16px;display:flex;justify-content:space-between;align-items:center;
         box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{font-size:18px;font-weight:700}
  .cart-icon{position:relative;font-size:22px;text-decoration:none;color:#fff}
  .cart-count{position:absolute;top:-6px;right:-8px;background:#fff;color:#ff6b00;
              font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
  
  /* Products Grid */
  .products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
  .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);
        display:flex;flex-direction:column}
  .card img{width:100%;height:150px;object-fit:cover;background:#eee}
  .card-body{padding:10px;display:flex;flex-direction:column;flex:1}
  .card-body h3{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:6px;
                display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
  .price{color:#ff6b00;font-weight:700;font-size:15px;margin-bottom:8px}
  .btn{width:100%;padding:8px;background:#ff6b00;color:#fff;border:none;border-radius:8px;
       font-weight:600;font-size:13px;cursor:pointer;margin-top:auto}
  .btn:active{background:#e55f00}
  
  /* Empty state */
  .empty{text-align:center;padding:60px 20px;color:#888}
  .empty span{font-size:48px;display:block;margin-bottom:12px}

  /* Toast */
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
         background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;
         opacity:0;transition:.3s;pointer-events:none;z-index:200}
  .toast.show{opacity:1}

  /* Bottom Nav */
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;
             display:flex;justify-content:space-around;padding:8px 0;z-index:100}
  nav.bottom a{flex:1;text-align:center;text-decoration:none;color:#888;font-size:11px;padding:4px}
  nav.bottom a.active{color:#ff6b00}
  nav.bottom a span{display:block;font-size:20px;margin-bottom:2px}
</style>
</head>
<body>

<header>
  <h1>🛍️ Pikari Bazar</h1>
  <a href="cart.html" class="cart-icon">
    🛒<span class="cart-count" id="cartCount">0</span>
  </a>
</header>

<div class="products" id="productList">
  <div class="empty"><span>⏳</span>Loading...</div>
</div>

<div class="toast" id="toast">Added to cart!</div>

<nav class="bottom">
  <a href="index.html" class="active"><span>🏠</span>Home</a>
  <a href="cart.html"><span>🛒</span>Cart</a>
  <a href="admin.html"><span>⚙️</span>Admin</a>
</nav>

<script type="module">
import { db, getUserId } from './config.js';
import { ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const uid = getUserId();
const list = document.getElementById('productList');
const toast = document.getElementById('toast');

// Google Drive link → direct image URL
function driveUrl(url) {
  if (!url) return 'https://via.placeholder.com/300x300?text=No+Image';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w400`;
  return url;
}

// Load products
onValue(ref(db, 'products'), (snap) => {
  const data = snap.val() || {};
  const items = Object.entries(data);
  list.innerHTML = '';
  if (items.length === 0) {
    list.innerHTML = `<div class="empty" style="grid-column:1/-1"><span>📦</span>No products yet</div>`;
    return;
  }
  items.forEach(([id, p]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${driveUrl(p.image)}" alt="${p.name}" loading="lazy"
           onerror="this.src='https://via.placeholder.com/300x300?text=Error'">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="price">৳${p.price}</p>
        <button class="btn" data-id="${id}">Add to Cart</button>
      </div>`;
    card.querySelector('.btn').onclick = () => addToCart(id, p);
    list.appendChild(card);
  });
});

async function addToCart(pid, product) {
  const cartRef = ref(db, `carts/${uid}/${pid}`);
  const snap = await get(cartRef);
  const existing = snap.val();
  await set(cartRef, {
    productId: pid,
    name: product.name,
    price: product.price,
    image: product.image,
    qty: existing ? existing.qty + 1 : 1
  });
  showToast('✅ Added to cart');
}

// Cart count
onValue(ref(db, `carts/${uid}`), (snap) => {
  const c = snap.val() || {};
  const count = Object.values(c).reduce((s, i) => s + i.qty, 0);
  document.getElementById('cartCount').textContent = count;
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}
</script>
</body>
</html>
