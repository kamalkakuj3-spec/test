<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Pikari Bazar</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
  .login-box{background:#fff;padding:30px 20px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.08);width:100%;max-width:360px}
  .login-box h2{text-align:center;color:#333;margin-bottom:20px;font-size:22px}
  .login-box input{width:100%;padding:14px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;background:#f9f9f9}
  .login-box input:focus{border-color:#ff6b00;background:#fff}
  .login-box button{width:100%;padding:14px;background:#ff6b00;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
  .login-box button:disabled{background:#ccc}
  .toggle-text{text-align:center;margin-top:15px;font-size:13px;color:#666}
  .toggle-text span{color:#ff6b00;font-weight:700;cursor:pointer}
  .msg-box{display:none;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;text-align:center;font-weight:600}
  .msg-box.error{background:#ffebee;color:#c62828;display:block;border:1px solid #ffcdd2}
  .msg-box.success{background:#e8f5e9;color:#2e7d32;display:block;border:1px solid #c8e6c9}
  .back-link{display:block;text-align:center;margin-top:15px;color:#888;text-decoration:none;font-size:13px}
</style>
</head>
<body>

<div class="login-box">
  <h2 id="formTitle">🔒 Login</h2>
  <div class="msg-box" id="msgBox"></div>
  
  <input type="text" id="userName" placeholder="আপনার নাম" style="display:none">
  <input type="email" id="userEmail" placeholder="ইমেইল (Email)">
  <input type="password" id="userPassword" placeholder="পাসওয়ার্ড (Password)">
  
  <button id="submitBtn">Login</button>
  
  <div class="toggle-text" id="toggleText">
    নতুন? <span>রেজিস্ট্রেশন করুন</span>
  </div>
  
  <a href="index.html" class="back-link">← হোমে ফিরে যান</a>
</div>

<script type="module">
import { auth, db } from './config.js';
import { 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword, 
  updateProfile 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

let isLogin = true;
const title = document.getElementById('formTitle');
const nameInput = document.getElementById('userName');
const emailInput = document.getElementById('userEmail');
const passInput = document.getElementById('userPassword');
const submitBtn = document.getElementById('submitBtn');
const toggleText = document.getElementById('toggleText');
const msgBox = document.getElementById('msgBox');

// Toggle Login/Register
toggleText.onclick = () => {
  isLogin = !isLogin;
  title.textContent = isLogin ? '🔒 Login' : '📝 Register';
  nameInput.style.display = isLogin ? 'none' : 'block';
  submitBtn.textContent = isLogin ? 'Login' : 'Register';
  toggleText.innerHTML = isLogin ? 'নতুন? <span>রেজিস্ট্রেশন করুন</span>' : 'অ্যাকাউন্ট আছে? <span>লগইন করুন</span>';
  msgBox.className = 'msg-box';
};

// Submit
submitBtn.onclick = async () => {
  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passInput.value;
  
  if (!email || !password) {
    msgBox.textContent = '❌ ইমেইল এবং পাসওয়ার্ড দিন';
    msgBox.className = 'msg-box error';
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = 'অপেক্ষা করুন...';
  msgBox.className = 'msg-box';

  try {
    if (isLogin) {
      await signInWithEmailAndPassword(auth, email, password);
      msgBox.textContent = '✅ লগইন সফল!';
      msgBox.className = 'msg-box success';
      setTimeout(() => window.location.href = 'index.html', 1000);
    } else {
      if (!name) throw new Error('নাম দিন');
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: name });
      await set(ref(db, 'users/' + cred.user.uid), {
        name: name,
        email: email,
        createdAt: Date.now()
      });
      msgBox.textContent = '✅ রেজিস্ট্রেশন সফল!';
      msgBox.className = 'msg-box success';
      setTimeout(() => window.location.href = 'index.html', 1000);
    }
  } catch (error) {
    let errorMsg = error.message;
    if (error.code === 'auth/user-not-found') errorMsg = 'এই ইমেইলে কোনো অ্যাকাউন্ট নেই';
    else if (error.code === 'auth/wrong-password') errorMsg = 'পাসওয়ার্ড ভুল';
    else if (error.code === 'auth/email-already-in-use') errorMsg = 'এই ইমেইল আগে থেকেই ব্যবহৃত';
    else if (error.code === 'auth/weak-password') errorMsg = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন';
    
    msgBox.textContent = '❌ ' + errorMsg;
    msgBox.className = 'msg-box error';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = isLogin ? 'Login' : 'Register';
  }
};
</script>
</body>
</html>
