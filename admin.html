<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Pikari Bazar</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;padding-bottom:70px}
  
  header{position:sticky;top:0;z-index:100;background:#1a1a2e;color:#fff;padding:14px 16px}
  header h1{font-size:18px}
  
  /* Login Screen */
  .login-screen{padding:40px 20px;text-align:center}
  .login-screen input{width:100%;max-width:320px;padding:14px;border:1px solid #ddd;
                       border-radius:10px;font-size:15px;margin:20px auto 10px;display:block}
  .login-screen button{width:100%;max-width:320px;padding:14px;background:#ff6b00;color:#fff;
                        border:none;border-radius:10px;font-weight:700;font-size:15px}
  
  /* Tabs */
  .tabs{display:flex;background:#fff;border-bottom:1px solid #eee;position:sticky;top:53px;z-index:99}
  .tabs button{flex:1;padding:12px;border:none;background:none;font-size:14px;font-weight:600;
                color:#888;cursor:pointer;border-bottom:3px solid transparent}
  .tabs button.active{color:#ff6b00;border-bottom-color:#ff6b00}
  
  .panel{padding:12px}
  .form-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;
              box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .form-card h3{font-size:15px;margin-bottom:12px;color:#333}
  .form-card input,.form-card textarea{width:100%;padding:11px;border:1px solid #ddd;
                                        border-radius:8px;font-size:14px;margin-bottom:10px;
                                        font-family:inherit;background:#f9f9f9}
  .form-card textarea{min-height:60px;resize:vertical}
  .form-card .hint{font-size:11px;color:#888;margin:-6px 0 10px}
  .btn-primary{width:100%;padding:12px;background:#ff6b00;color:#fff;border:none;
                border-radius:8px;font-weight:700;font-size:14px}
  
  /* Product row */
  .product-row{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;
                display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .product-row img{width:52px;height:52px;border-radius:6px;object-fit:cover;background:#eee;flex-shrink:0}
  .product-row .info{flex:1;min-width:0}
  .product-row .info h4{font-size:13px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .product-row .info .p{color:#ff6b00;font-size:13px;font-weight:700}
  .del-btn{background:#e74c3c;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:12px}
  
  /* Order row */
  .order-row{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .order-row h4{font-size:14px;margin-bottom:6px;color:#333}
  .order-row .meta{font-size:12px;color:#666;line-height:1.6;margin-bottom:8px}
  .order-row .meta b{color:#333}
  .order-row .items{font-size:12px;color:#555;background:#f9f9f9;padding:8px;border-radius:6px;margin-bottom:8px}
  .status-select{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;
                  font-weight:600;background:#fff;width:100%}
  
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;
          color:#fff;margin-left:6px;text-transform:uppercase;font-weight:700}
  .pending{background:#f39c12}.confirmed{background:#3498db}
  .shipped{background:#9b59b6}.delivered{background:#27ae60}.cancelled{background:#e74c3c}
  
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;
             display:flex;justify-content:space-around;padding:8px 0;z-index:100}
  nav.bottom a{flex:1;text-align:center;text-decoration:none;color:#888;font-size:11px;padding:4px}
  nav.bottom a.active{color:#ff6b00}
  nav.bottom a span{display:block;font-size:20px;margin-bottom:2px}
</style>
</head>
<body>

<header><h1>⚙️ Admin Panel</h1></header>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <p>🔒 Admin password দিন</p>
  <input type="password" id="adminPass" placeholder="Password">
  <button id="loginBtn">Enter</button>
  <p id="loginMsg" style="color:#e74c3c;margin-top:10px;font-size:13px"></p>
</div>

<!-- Main Panel -->
<div id="mainPanel" style="display:none">
  <div class="tabs">
    <button class="active" data-tab="products">📦 Products</button>
    <button data-tab="orders">🛒 Orders</button>
  </div>
  
  <div id="tab-products" class="panel">
    <div class="form-card">
      <h3>➕ Add Product</h3>
      <input id="pName" placeholder="Product name *">
      <input id="pPrice" type="number" placeholder="Price (৳) *">
      <input id="pImage" placeholder="Google Drive image link">
      <p class="hint">Drive link → share → anyone with link</p>
      <textarea id="pDesc" placeholder="Description (optional)"></textarea>
      <button class="btn-primary" id="addProductBtn">Add Product</button>
    </div>
    <h3 style="margin:16px 0 8px 4px;font-size:15px">All Products</h3>
    <div id="productList"></div>
  </div>
  
  <div id="tab-orders" class="panel" style="display:none">
    <h3 style="margin-bottom:10px;font-size:15px">All Orders</h3>
    <div id="orderList"></div>
  </div>
</div>

<nav class="bottom">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="cart.html"><span>🛒</span>Cart</a>
  <a href="admin.html" class="active"><span>⚙️</span>Admin</a>
</nav>

<script type="module">
import { db } from './config.js';
import { ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const ADMIN_PASSWORD = 'pikari2024'; // ⚠️ পরে পরিবর্তন করবেন

// Check if already logged in this session
if (sessionStorage.getItem('pb_admin') === 'yes') {
  showPanel();
}

document.getElementById('loginBtn').onclick = () => {
  const pass = document.getElementById('adminPass').value;
  if (pass === ADMIN_PASSWORD) {
    sessionStorage.setItem('pb_admin', 'yes');
    showPanel();
  } else {
    document.getElementById('loginMsg').textContent = '❌ Wrong password';
  }
};

function showPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainPanel').style.display = 'block';
  initAdmin();
}

function driveUrl(url) {
  if (!url) return 'https://via.placeholder.com/100?text=No';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w200`;
  return url;
}

let initialized = false;
function initAdmin() {
  if (initialized) return;
  initialized = true;
  
  // Tabs
  document.querySelectorAll('.tabs button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('tab-products').style.display = 
        b.dataset.tab === 'products' ? 'block' : 'none';
      document.getElementById('tab-orders').style.display = 
        b.dataset.tab === 'orders' ? 'block' : 'none';
    };
  });
  
  // Add product
  document.getElementById('addProductBtn').onclick = async () => {
    const name = document.getElementById('pName').value.trim();
    const price = +document.getElementById('pPrice').value;
    const image = document.getElementById('pImage').value.trim();
    const desc = document.getElementById('pDesc').value.trim();
    if (!name || !price) return alert('Name & Price required');
    await push(ref(db, 'products'), {
      name, price, image, desc, createdAt: Date.now()
    });
    document.getElementById('pName').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pImage').value = '';
    document.getElementById('pDesc').value = '';
    alert('✅ Product added');
  };
  
  // List products
  onValue(ref(db, 'products'), (snap) => {
    const list = document.getElementById('productList');
    list.innerHTML = '';
    const data = snap.val() || {};
    const entries = Object.entries(data);
    if (entries.length === 0) {
      list.innerHTML = '<p style="text-align:center;color:#888;padding:20px">No products</p>';
      return;
    }
    entries.forEach(([id, p]) => {
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <img src="${driveUrl(p.image)}" alt="">
        <div class="info">
          <h4>${p.name}</h4>
          <div class="p">৳${p.price}</div>
        </div>
        <button class="del-btn" data-id="${id}">Delete</button>`;
      row.querySelector('.del-btn').onclick = () => {
        if (confirm('Delete this product?')) remove(ref(db, 'products/' + id));
      };
      list.appendChild(row);
    });
  });
  
  // List orders
  onValue(ref(db, 'orders'), (snap) => {
    const list = document.getElementById('orderList');
    list.innerHTML = '';
    const data = snap.val() || {};
    const entries = Object.entries(data).sort((a, b) => b[1].createdAt - a[1].createdAt);
    if (entries.length === 0) {
      list.innerHTML = '<p style="text-align:center;color:#888;padding:20px">No orders</p>';
      return;
    }
    entries.forEach(([id, o]) => {
      const items = Object.values(o.items || {}).map(i => `${i.name} ×${i.qty}`).join(', ');
      const date = new Date(o.createdAt).toLocaleString('bn-BD');
      const row = document.createElement('div');
      row.className = 'order-row';
      row.innerHTML = `
        <h4>${o.customer?.name || 'Unknown'} 
          <span class="badge ${o.status}">${o.status}</span></h4>
        <div class="meta">
          📞 <b>${o.customer?.phone || ''}</b><br>
          📍 ${o.customer?.address || ''}<br>
          💰 Total: <b>৳${o.total}</b> (${o.payment})<br>
          🕐 ${date}
        </div>
        <div class="items">${items}</div>
        <select class="status-select" data-id="${id}">
          <option value="pending" ${o.status==='pending'?'selected':''}>⏳ Pending</option>
          <option value="confirmed" ${o.status==='confirmed'?'selected':''}>✅ Confirmed</option>
          <option value="shipped" ${o.status==='shipped'?'selected':''}>🚚 Shipped</option>
          <option value="delivered" ${o.status==='delivered'?'selected':''}>📦 Delivered</option>
          <option value="cancelled" ${o.status==='cancelled'?'selected':''}>❌ Cancelled</option>
        </select>`;
      row.querySelector('.status-select').onchange = (e) => {
        update(ref(db, 'orders/' + id), { status: e.target.value });
      };
      list.appendChild(row);
    });
  });
}
</script>
</body>
</html>
