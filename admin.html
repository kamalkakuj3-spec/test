<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin - Pikari Bazar</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;padding-bottom:70px}
  header{position:sticky;top:0;z-index:100;background:#1a1a2e;color:#fff;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  header h1{font-size:18px;font-weight:700}
  .login-screen{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh}
  .login-screen p{font-size:16px;color:#444;margin-bottom:15px;font-weight:600}
  .login-screen input{width:100%;max-width:320px;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:15px;margin-bottom:10px;outline:none}
  .login-screen button{width:100%;max-width:320px;padding:14px;background:#ff6b00;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
  .tabs{display:flex;background:#fff;border-bottom:1px solid #eee;position:sticky;top:53px;z-index:99}
  .tabs button{flex:1;padding:14px;border:none;background:none;font-size:14px;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent;transition:0.2s}
  .tabs button.active{color:#ff6b00;border-bottom-color:#ff6b00}
  .panel{padding:12px;animation: fadeIn 0.3s ease}
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .form-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:15px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .form-card h3{font-size:15px;margin-bottom:12px;color:#333}
  .form-card input,.form-card textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:10px;font-family:inherit;background:#f9f9f9;outline:none}
  .form-card textarea{min-height:60px;resize:vertical}
  .form-card .hint{font-size:11px;color:#888;margin:-4px 0 12px}
  .btn-primary{width:100%;padding:14px;background:#ff6b00;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer}
  .btn-primary:disabled{background:#ccc;cursor:not-allowed}
  .msg-box{display:none;padding:12px;border-radius:8px;font-size:14px;margin-bottom:12px;text-align:center;font-weight:600}
  .msg-box.success{background:#d4edda;color:#155724;display:block;border:1px solid #c3e6cb}
  .msg-box.error{background:#f8d7da;color:#721c24;display:block;border:1px solid #f5c6cb}
  .product-row{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .product-row img{width:56px;height:56px;border-radius:6px;object-fit:cover;background:#eee;flex-shrink:0}
  .product-row .info{flex:1;min-width:0}
  .product-row .info h4{font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#333}
  .product-row .info .p{color:#ff6b00;font-size:14px;font-weight:700}
  .del-btn{background:#ffe6e6;color:#e74c3c;border:none;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
  .order-row{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .order-row h4{font-size:15px;margin-bottom:8px;color:#333;display:flex;justify-content:space-between;align-items:center}
  .order-row .meta{font-size:13px;color:#666;line-height:1.6;margin-bottom:10px;background:#f9f9f9;padding:10px;border-radius:8px}
  .order-row .meta b{color:#222}
  .order-row .items{font-size:13px;color:#444;margin-bottom:12px;padding-left:5px}
  .status-select{padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-weight:600;background:#f9f9f9;width:100%;outline:none;cursor:pointer}
  .badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;color:#fff;text-transform:uppercase;font-weight:700;letter-spacing:0.5px}
  .pending{background:#f39c12}.confirmed{background:#3498db}.shipped{background:#9b59b6}.delivered{background:#27ae60}.cancelled{background:#e74c3c}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0;z-index:100}
  nav.bottom a{flex:1;text-align:center;text-decoration:none;color:#888;font-size:11px;padding:4px;font-weight:600}
  nav.bottom a.active{color:#ff6b00}
  nav.bottom a span{display:block;font-size:20px;margin-bottom:2px}
  .empty-text{text-align:center;color:#888;padding:30px 10px;font-size:14px}
</style>
</head>
<body>

<header><h1>⚙️ Admin Panel</h1></header>

<div class="login-screen" id="loginScreen">
  <p>🔒 Admin password দিন</p>
  <input type="password" id="adminPass" placeholder="Password" autocomplete="off">
  <button id="loginBtn">Enter</button>
  <p id="loginMsg" style="color:#e74c3c;margin-top:15px;font-size:14px;font-weight:600;"></p>
</div>

<div id="mainPanel" style="display:none">
  <div class="tabs">
    <button class="active" data-tab="products">📦 Products</button>
    <button data-tab="orders">🛒 Orders</button>
  </div>
  
  <div id="tab-products" class="panel">
    <div class="form-card">
      <h3>➕ Add Product</h3>
      <div id="adminMsg" class="msg-box"></div>
      <input id="pName" placeholder="Product name *">
      <input id="pPrice" type="number" placeholder="Price (৳) *">
      <input id="pImage" placeholder="Google Drive image link">
      <p class="hint">Drive link → share → anyone with link</p>
      <textarea id="pDesc" placeholder="Description (optional)"></textarea>
      <button class="btn-primary" id="addProductBtn">Add Product</button>
    </div>
    <h3 style="margin:16px 4px 10px;font-size:16px;color:#333">All Products</h3>
    <div id="productList"></div>
  </div>
  
  <div id="tab-orders" class="panel" style="display:none">
    <h3 style="margin-bottom:10px;font-size:16px;color:#333">All Orders</h3>
    <div id="orderList"></div>
  </div>
</div>

<nav class="bottom">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="cart.html"><span>🛒</span>Cart</a>
  <a href="admin.html" class="active"><span>⚙️</span>Admin</a>
</nav>

<script type="module">
import { db } from './config.js';
import { ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const ADMIN_PASSWORD = 'pikari2024'; 
let initialized = false;

if (sessionStorage.getItem('pb_admin') === 'yes') {
  showPanel();
}

document.getElementById('loginBtn').onclick = () => {
  const pass = document.getElementById('adminPass').value;
  if (pass === ADMIN_PASSWORD) {
    sessionStorage.setItem('pb_admin', 'yes');
    showPanel();
  } else {
    document.getElementById('loginMsg').textContent = '❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।';
  }
};

document.getElementById('adminPass').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

function showPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainPanel').style.display = 'block';
  if (!initialized) {
    initAdmin();
    initialized = true;
  }
}

function driveUrl(url) {
  if (!url) return 'https://via.placeholder.com/100?text=No+Image';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w200`;
  return url;
}

function initAdmin() {
  document.querySelectorAll('.tabs button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('tab-products').style.display = b.dataset.tab === 'products' ? 'block' : 'none';
      document.getElementById('tab-orders').style.display = b.dataset.tab === 'orders' ? 'block' : 'none';
    };
  });
  
  document.getElementById('addProductBtn').onclick = async () => {
    const name = document.getElementById('pName').value.trim();
    const price = +document.getElementById('pPrice').value;
    const image = document.getElementById('pImage').value.trim();
    const desc = document.getElementById('pDesc').value.trim();
    
    const msgBox = document.getElementById('adminMsg');
    const btn = document.getElementById('addProductBtn');

    msgBox.className = 'msg-box';
    msgBox.textContent = '';

    if (!name || !price) {
      msgBox.textContent = '❌ প্রোডাক্টের নাম এবং দাম অবশ্যই দিতে হবে।';
      msgBox.className = 'msg-box error';
      return;
    }

    btn.textContent = 'Adding...';
    btn.disabled = true;

    try {
      await push(ref(db, 'products'), {
        name, price, image, desc, createdAt: Date.now()
      });
      
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pImage').value = '';
      document.getElementById('pDesc').value = '';
      
      msgBox.textContent = '✅ প্রোডাক্ট সফলভাবে যোগ করা হয়েছে!';
      msgBox.className = 'msg-box success';
      
      setTimeout(() => { msgBox.className = 'msg-box'; }, 3000);

    } catch (error) {
      msgBox.textContent = '❌ সমস্যা হয়েছে: ' + error.message;
      msgBox.className = 'msg-box error';
    } finally {
      btn.textContent = 'Add Product';
      btn.disabled = false;
    }
  };
  
  onValue(ref(db, 'products'), (snap) => {
    const list = document.getElementById('productList');
    list.innerHTML = '';
    const data = snap.val() || {};
    const entries = Object.entries(data).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    
    if (entries.length === 0) {
      list.innerHTML = '<p class="empty-text">কোনো প্রোডাক্ট নেই</p>';
      return;
    }
    
    entries.forEach(([id, p]) => {
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <img src="${driveUrl(p.image)}" alt="">
        <div class="info">
          <h4>${p.name}</h4>
          <div class="p">৳${p.price}</div>
        </div>
        <button class="del-btn" data-id="${id}">Delete</button>`;
        
      row.querySelector('.del-btn').onclick = () => {
        if (confirm('আপনি কি নিশ্চিত এই প্রোডাক্টটি ডিলিট করতে চান?')) {
          remove(ref(db, 'products/' + id));
        }
      };
      list.appendChild(row);
    });
  });
  
  onValue(ref(db, 'orders'), (snap) => {
    const list = document.getElementById('orderList');
    list.innerHTML = '';
    const data = snap.val() || {};
    const entries = Object.entries(data).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    
    if (entries.length === 0) {
      list.innerHTML = '<p class="empty-text">কোনো অর্ডার নেই</p>';
      return;
    }
    
    entries.forEach(([id, o]) => {
      const items = Object.values(o.items || {}).map(i => `${i.name} ×${i.qty}`).join(', ');
      const date = new Date(o.createdAt).toLocaleString('bn-BD');
      
      const row = document.createElement('div');
      row.className = 'order-row';
      row.innerHTML = `
        <h4>
          ${o.customer?.name || 'Unknown'}
          <span class="badge ${o.status}">${o.status}</span>
        </h4>
        <div class="meta">
          📞 <b>${o.customer?.phone || ''}</b><br>
          📍 ${o.customer?.address || ''}<br>
          💰 Total: <b>৳${o.total}</b> (${o.payment.toUpperCase()})<br>
          🕐 ${date}
        </div>
        <div class="items">📦 <b>Items:</b> ${items}</div>
        <select class="status-select" data-id="${id}">
          <option value="pending" ${o.status==='pending'?'selected':''}>⏳ Pending</option>
          <option value="confirmed" ${o.status==='confirmed'?'selected':''}>✅ Confirmed</option>
          <option value="shipped" ${o.status==='shipped'?'selected':''}>🚚 Shipped</option>
          <option value="delivered" ${o.status==='delivered'?'selected':''}>📦 Delivered</option>
          <option value="cancelled" ${o.status==='cancelled'?'selected':''}>❌ Cancelled</option>
        </select>`;
        
      row.querySelector('.status-select').onchange = (e) => {
        update(ref(db, 'orders/' + id), { status: e.target.value });
      };
      list.appendChild(row);
    });
  });
}
</script>
</body>
</html>
