<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Pikari Bazar</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;padding-bottom:70px}
  
  header{position:sticky;top:0;z-index:100;background:#ff6b00;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header a{color:#fff;text-decoration:none;font-size:22px}
  header h1{font-size:18px;font-weight:700}
  
  .container{padding:12px}
  
  .order-card {
    background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .order-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 10px; border-bottom: 1px dashed #eee; margin-bottom: 10px;
  }
  .order-id { font-size: 12px; color: #888; font-weight: 600; }
  .order-date { font-size: 12px; color: #888; }
  
  .order-status {
    display: inline-block; padding: 4px 10px; border-radius: 12px;
    font-size: 11px; color: #fff; text-transform: uppercase; font-weight: 700;
    margin-bottom: 10px;
  }
  .status-pending { background: #f39c12; }
  .status-confirmed { background: #3498db; }
  .status-shipped { background: #9b59b6; }
  .status-delivered { background: #27ae60; }
  .status-cancelled { background: #e74c3c; }
  
  .order-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
  .order-item:last-child { border-bottom: none; }
  .order-item img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #eee; }
  .order-item .details { flex: 1; font-size: 13px; }
  .order-item .details b { color: #333; display: block; margin-bottom: 2px; }
  .order-item .details span { color: #888; font-size: 12px; }
  
  .order-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed #eee;
  }
  .order-footer .total { font-size: 15px; font-weight: 700; color: #ff6b00; }
  .order-footer .payment { font-size: 11px; color: #666; background: #f5f5f5; padding: 3px 8px; border-radius: 10px; }
  
  .empty-state { text-align: center; padding: 80px 20px; color: #888; }
  .empty-state span { font-size: 64px; display: block; margin-bottom: 16px; }
  .empty-state a { display: inline-block; margin-top: 16px; padding: 10px 24px; background: #ff6b00; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
  
  .login-prompt { text-align: center; padding: 80px 20px; }
  .login-prompt span { font-size: 64px; display: block; margin-bottom: 16px; }
  .login-prompt p { color: #888; margin-bottom: 16px; }
  .login-prompt a { display: inline-block; padding: 12px 24px; background: #ff6b00; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 700; }
  
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0;z-index:100}
  nav.bottom a{flex:1;text-align:center;text-decoration:none;color:#888;font-size:11px;padding:4px}
  nav.bottom a.active{color:#ff6b00}
  nav.bottom a span{display:block;font-size:20px;margin-bottom:2px}
  
  .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(245, 245, 247, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
  .spinner { width: 50px; height: 50px; border: 5px solid #ffe6d9; border-top: 5px solid #ff6b00; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loader-overlay" id="loaderOverlay">
  <div class="spinner"></div>
</div>

<header>
  <a href="index.html">←</a>
  <h1>📦 My Orders</h1>
</header>

<div class="container" id="ordersList">
  <div class="login-prompt">
    <span>👤</span>
    <p>অর্ডার দেখতে লগইন করুন</p>
    <a href="login.html">Login Now</a>
  </div>
</div>

<nav class="bottom">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="#" id="navSearchBtn"><span>🔍</span>Search</a>
  <a href="login.html" id="navProfileBtn"><span>👤</span>Profile</a>
  <a href="contact.html"><span>📞</span>Contact</a>
  <a href="admin.html"><span>⚙️</span>Admin</a>
</nav>

<script type="module">
import { db, auth } from './config.js';
import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const ordersList = document.getElementById('ordersList');
const loader = document.getElementById('loaderOverlay');

function driveUrl(url) {
  if (!url) return 'https://via.placeholder.com/100?text=No';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w200`;
  return url;
}

onAuthStateChanged(auth, (user) => {
  if (!user) {
    // লগইন নেই
    if (loader) loader.style.display = 'none';
    ordersList.innerHTML = `
      <div class="login-prompt">
        <span>👤</span>
        <p>আপনার অর্ডার হিস্টোরি দেখতে লগইন করুন</p>
        <a href="login.html">Login Now</a>
      </div>
    `;
    return;
  }

  // লগইন করা আছে - অর্ডার লোড করা
  onValue(ref(db, 'orders'), (snap) => {
    const allOrders = snap.val() || {};
    const myOrders = Object.entries(allOrders)
      .filter(([id, o]) => o.userId === user.uid)
      .sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

    if (loader) loader.style.display = 'none';

    if (myOrders.length === 0) {
      ordersList.innerHTML = `
        <div class="empty-state">
          <span>📦</span>
          <p>আপনার কোনো অর্ডার নেই</p>
          <a href="index.html">Shop Now</a>
        </div>
      `;
      return;
    }

    let html = '';
    myOrders.forEach(([id, o]) => {
      const date = new Date(o.createdAt).toLocaleString('bn-BD');
      const shortId = id.slice(-6).toUpperCase();
      
      let itemsHtml = '';
      Object.values(o.items || {}).forEach(item => {
        itemsHtml += `
          <div class="order-item">
            <img src="${driveUrl(item.image)}" alt="">
            <div class="details">
              <b>${item.name}</b>
              <span>৳${item.price} × ${item.qty} = ৳${item.price * item.qty}</span>
            </div>
          </div>
        `;
      });

      html += `
        <div class="order-card">
          <div class="order-header">
            <div class="order-id">#${shortId}</div>
            <div class="order-date">${date}</div>
          </div>
          <div>
            <span class="order-status status-${o.status}">${o.status}</span>
          </div>
          <div class="order-items">${itemsHtml}</div>
          <div class="order-footer">
            <div class="total">মোট: ৳${o.total}</div>
            <div class="payment">${o.payment.toUpperCase()}</div>
          </div>
        </div>
      `;
    });

    ordersList.innerHTML = html;
  });
});
</script>
</body>
</html>
